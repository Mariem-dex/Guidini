    <script>
      (function () {
        // --- pixel telemetry -------------------------------------------
        // Observability for vendor pixel network requests. Two
        // independent counters, no correlation:
        //  - pixel_attempt:  posted at each vendor call site
        //  - pixel_observed: posted per classified beacon seen by a
        //                    PerformanceObserver on resource timings
        // A blocked/failed vendor (ad-blocker, CSP, DNS, SDK didn't
        // load) shows up as attempt-without-observed in aggregate. The
        // resource URL is used only for vendor classification here and
        // is never sent to the parent.
        //
        // Cross-origin caveat: pixel endpoints (facebook.com/tr,
        // doubleclick.net, googleadservices.com) do not send
        // Timing-Allow-Origin, so responseStatus is zeroed for most
        // entries; http_status is only populated when the browser
        // actually exposes it.
        var pixelFirePixelIds = {}; // vendor → configured pixel/tag ID
        var pixelObserverStarted = false;

        // Patterns match only the conversion beacons, not loader /
        // aux / config requests (e.g. gtag/destination,
        // conversion_async.js). gtag typically fans one conversion
        // out to several of these endpoints; each is reported as its
        // own pixel_observed — attempt and observed counts are not
        // expected to be 1:1 per event, only comparable in aggregate.
        var PIXEL_FIRE_PATTERNS = [
          { match: "facebook.com/tr", vendor: "facebook" },
          { match: "googleadservices.com/pagead/conversion/", vendor: "google_ads" },
          { match: "google.com/pagead/", vendor: "google_ads" },
          { match: "googleads.g.doubleclick.net/pagead/", vendor: "google_ads" },
          { match: "fls.doubleclick.net/", vendor: "floodlight" },
          { match: "ad.doubleclick.net/activity", vendor: "floodlight" },
          { match: "ad.doubleclick.net/ddm/activity", vendor: "floodlight" },
        ];

        function classifyPixelResource(url) {
          for (var i = 0; i < PIXEL_FIRE_PATTERNS.length; i++) {
            if (url.indexOf(PIXEL_FIRE_PATTERNS[i].match) !== -1) {
              return PIXEL_FIRE_PATTERNS[i];
            }
          }
          return null;
        }

        function sendPixelTelemetry(payload) {
          if (window.isolatedSegment && window.isolatedSegment.sendMessage) {
            window.isolatedSegment.sendMessage(payload);
          }
        }

        function pixelAttempt(pixel) {
          if (!pixel) return;
          sendPixelTelemetry({ type: "pixel_attempt", pixel: pixel });
        }

        function pixelObserved(entry, cls) {
          var pixel = pixelFirePixelIds[cls.vendor];
          if (!pixel) return;
          var payload = {
            type: "pixel_observed",
            pixel: pixel,
            duration_ms: Math.round(entry.duration || 0),
          };
          var status = entry.responseStatus;
          if (typeof status === "number" && status > 0) {
            payload.http_status = status;
          }
          sendPixelTelemetry(payload);
        }

        function startPixelFireObserver() {
          if (pixelObserverStarted) return;
          if (typeof PerformanceObserver === "undefined") return;
          try {
            var po = new PerformanceObserver(function (list) {
              var entries = list.getEntries();
              for (var i = 0; i < entries.length; i++) {
                var cls = classifyPixelResource(entries[i].name);
                if (cls) try { pixelObserved(entries[i], cls); } catch {}
              }
            });
            po.observe({ type: "resource", buffered: true });
            pixelObserverStarted = true;
          } catch {}
        }
        // --- end pixel telemetry ---------------------------------------

        // sendMessage below is the one outbound in this frame that posts
        // with targetOrigin "*", and only claude.ai's page listens for it.
        // So it posts only on an ALLOWLIST of the claude.ai-family
        // isolation hosts, never on the marketing hosts (a.claude.com,
        // a.anthropic.com) or a future a.* host. Non-a.* serving (dev,
        // tests, the same-origin preview fallback) is the app's own
        // origin. The staging host is matched by its
        // app-name-plus-environment prefix: internal domain suffixes must
        // not appear in the public bundle (the build's tree-shaking canary
        // enforces this).
        var postsTelemetry = (function () {
          var host = window.location.hostname;
          if (host.indexOf("a.") !== 0) {
            return true;
          }
          var base = host.substring(2);
          return (
            base === "claude.ai" ||
            base === "preview.claude.ai" ||
            base.indexOf("claude-ai.staging") === 0
          );
        })();

        window.isolatedSegment = {
          sendMessage: function (data) {
            if (!postsTelemetry) {
              return;
            }
            if (window.parent && window.parent !== window) {
              try {
                window.parent.postMessage(
                  {
                    source: "isolated-segment",
                    ...data,
                  },
                  "*",
                );
              } catch {}
            }
          },

          // Pixel-fire telemetry hooks for the AtmConsumer block below.
          // The vendor id map and the PerformanceObserver above are
          // closure-local to this script, so
          // the ATM vendor adapters register their ids and count
          // attempts through these two entry points. Any script
          // in this frame can call them; that stays within this
          // telemetry's documented trust envelope (counts only, and the
          // parent allowlists the pixel value it relays). The Meta and
          // gtag (Google Ads, Floodlight) adapters use them; the other
          // vendors' fire accounting rides the per-fire metric relay,
          // and their observer patterns land with each vendor's
          // verified beacon hosts at go-live.
          registerPixelFireId: function (vendor, pixelId) {
            if (typeof vendor !== "string" || vendor.length === 0) return;
            if (typeof pixelId !== "string" || pixelId.length === 0) return;
            // First registration wins; own-property lookup so a name
            // like "constructor" cannot read through the prototype.
            if (!Object.prototype.hasOwnProperty.call(pixelFirePixelIds, vendor)) {
              pixelFirePixelIds[vendor] = pixelId;
            }
            startPixelFireObserver();
          },

          attemptPixelFire: function (vendor) {
            if (typeof vendor !== "string") return;
            if (!Object.prototype.hasOwnProperty.call(pixelFirePixelIds, vendor)) {
              return;
            }
            pixelAttempt(pixelFirePixelIds[vendor]);
          },
        };
      })();
    </script>
    <script>
      (function () {
        // --- ATM (Ant Tag Manager) consumer ---------------------------
        // Receiving endpoint for the parent-page atmBridge feeder
        // (packages/antalytics-react/src/atmBridge.ts).
        // Validated envelopes are EXECUTED: each destination entry
        // routes to its vendor adapter (see VENDOR_ADAPTERS below);
        // destinations with no adapter are inert by design - the parent
        // may declare routing for vendors this build does not carry yet,
        // and the two sides roll independently.

        // Off as shipped: frame scripts can read window and wrap console methods to capture
        // what is logged, and envelopes carry every vendor's match keys. Closure-local, so only a
        // DevTools local override turns it on; then [AtmConsumer] lines log and the sink fills.
        var ATM_DEBUG = false;
        function logDebug(message, ...args) {
          if (ATM_DEBUG) {
            console.debug("[AtmConsumer]", message, ...args);
          }
        }

        // Window.parent is a [Replaceable] attribute: any in-frame vendor
        // script can assign window.parent = window and then self-post a
        // GENUINE (isTrusted, same-origin) message whose source equals the
        // replaced value — so every sender comparison and outbound post
        // below uses this eval-time capture, never a live window.parent
        // read. LOAD-BEARING ORDER: this inline script MUST stay ahead of
        // any third-party script tag in this document — the capture is
        // genuine only because it runs before vendor code can touch the
        // global. The only earlier inline block is this page's own pixel
        // telemetry; vendor bundles load asynchronously after.
        var realParent = window.parent;

        // The wire protocol with the parent-page bridge: target
        // namespaces the bus; the types are
        // the event envelope and the handshake legs (iframe announces
        // ready until the parent acks init). These mirror the
        // ATM_BRIDGE_* constants exported from
        // packages/antalytics-react/src/atmBridge.ts — duplicated as
        // literals because this standalone page has no build step to
        // import through; the cross-side agreement is pinned by
        // apps/claude-ai/src/atmConsumer.test.ts, which drives
        // THIS script with the bridge package's exported constants.
        var MESSAGE_TARGET = "atm-bridge";
        // v2: the envelope is a resolved instruction — it carries the
        // event's destination list (with per-destination enriched
        // values) and this side executes it with no routing config of
        // its own (its only local table is the build-pinned pixel-id
        // allowlist in the executor below, a bound, not routing).
        // The version lives in the type string: a v1-only consumer
        // would drop v2 envelopes as an unknown type and vice versa, so
        // the two sides can land and roll independently.
        var EVENT_MESSAGE_TYPE = "atm.analytics_event.v2";
        var READY_MESSAGE_TYPE = "atm.ready.v1";
        var INIT_MESSAGE_TYPE = "atm.init.v1";
        // iframe → parent: one rejected-message or adapter-failure
        // count (enum only, no content); this sandboxed page has no
        // Datadog SDK, so the parent emits to RUM on our behalf.
        // Mirrors ATM_BRIDGE_METRIC_MESSAGE_TYPE in atmBridge.ts; the
        // reason values mirror ATM_CONSUMER_REJECT_REASONS and the
        // parent drops anything outside that closed set.
        var METRIC_MESSAGE_TYPE = "atm.metric.v1";
        // iframe -> parent: one pixel-fire record per vendor pixel
        // call an adapter makes - {source, type, event, destination,
        // pixel_id}. Every field names config the parent itself
        // resolved onto the instruction (the event allowlist, the
        // routing entry, ATM_VENDOR_PIXEL_IDS), so the parent
        // re-validates each against its own config and drops anything
        // it cannot ground-truth. Mirrors
        // ATM_BRIDGE_PIXEL_FIRE_MESSAGE_TYPE in atmBridge.ts.
        var PIXEL_FIRE_MESSAGE_TYPE = "atm.pixel_fire.v1";
        // Defensive cap on a v2 envelope's destination list. The bridge
        // can only produce as many entries as the event's config
        // declares (single digits); a forged message could send
        // thousands. Generous multiple of any plausible config size.
        var DESTINATIONS_MAX = 32;
        // Defensive caps on one entry's pixel_ids list (count, and each
        // id's length). Real pixel ids are short numeric strings and a
        // vendor needs a handful of datasets at most; a forged message
        // could send thousands of long strings.
        var PIXEL_IDS_MAX = 10;
        var PIXEL_ID_LENGTH_MAX = 64;
        // An entry's mk: a lowercase SHA-256 hex digest, nothing else.
        var MATCH_KEY_PATTERN = /^[0-9a-f]{64}$/;
        // An entry's plan: an uppercase plan code the parent's config chose.
        var PLAN_PATTERN = /^[A-Z0-9_]{1,32}$/;
        // An entry's conversion_event: a lowercase event name the parent's config chose.
        var CONVERSION_EVENT_PATTERN = /^[a-z0-9_]{1,32}$/;
        // The page location's wire bounds, pinned to atmBridge.ts's copy
        // by atmPageLocationBoundsSync.test.ts.
        var PAGE_PATH_MAX_LENGTH = 1024;
        var PAGE_QUERY_MAX_LENGTH = 2048;
        var PAGE_PATH_PATTERN = /^\/[A-Za-z0-9._~!$&'()*+,;=:@%/[\]^|-]*$/;
        var PAGE_QUERY_PATTERN = /^[A-Za-z0-9_]{1,32}=[A-Za-z0-9*._%+-]*(?:&[A-Za-z0-9_]{1,32}=[A-Za-z0-9*._%+-]*)*$/;
        var RECEIVED_MAX = 50;
        // Reject-metric posts are capped per page load: enough to see a
        // real probe or contract break in RUM, bounded if something
        // spams forged messages at the frame.
        var METRICS_MAX = 100;
        // Pixel-fire posts ride their own budget: fires are expected
        // and repeat per routed event (SPA navigations), so a budget
        // shared with METRICS_MAX would let normal fire volume blind
        // the reject counts, and a reject flood blind the fire counts.
        var PIXEL_FIRE_METRICS_MAX = 100;
        // Closure-local on purpose: this is the cap's authoritative
        // state, and the other scripts in this frame are exactly the
        // untrusted code the cap bounds — a window-global counter would
        // hand them the reset knob. The dev-visible mirror below is a
        // getter-only, non-configurable view of this variable.
        var metricsPosted = 0;
        // Closure-local like metricsPosted, and for the same reason:
        // the cap's authoritative state must be out of reach of the
        // vendor code it bounds. Dev-visible mirror below.
        var pixelFireMetricsPosted = 0;
        // Stop announcing after about 30 s if the parent never answers.
        var READY_MAX_ATTEMPTS = 60;
        var readyAttempts = 0;
        // Caps on the init-delivered killswitch snapshot (same doctrine
        // as DESTINATIONS_MAX — a forged init could send anything):
        // accepted ids, per-id length, and raw entries examined before
        // the scan gives up.
        var KILLED_PIXEL_IDS_MAX = 64;
        var KILLED_PIXEL_ID_LENGTH_MAX = 64;
        var KILLED_PIXEL_IDS_SCAN_MAX = 256;

        var readyInterval = null;
        // The marketing zones serve real traffic on both the bare and
        // the www parent hosts; www handling below is scoped to exactly
        // those zones so the claude.ai family's behavior stays
        // byte-identical.
        var MARKETING_PARENT_DOMAINS = ["claude.com", "anthropic.com"];

        // Outbound origin pin (the bus spec pins BOTH directions; the
        // pixel telemetry sendMessage's "*" is deliberately not
        // copied). Before any inbound message exists, the parent origin
        // candidates are derived from our own hostname: this frame is
        // served from a.<parent-domain>, so stripping the "a." prefix
        // names the parent domain — and on the marketing zones the www
        // form is a second candidate, because the embedding page may be
        // either host (same-origin dev keeps location.origin). Pre-init
        // outbound posts once per candidate; postMessage with a
        // non-matching targetOrigin is silently dropped, so only the
        // real parent ever receives anything. After a validated init
        // arrives, the candidates collapse to that event's exact
        // origin.
        var parentOrigins = (function () {
          var host = window.location.hostname;
          if (host.indexOf("a.") === 0) {
            var base = host.substring(2);
            var basePort = base +
              (window.location.port ? ":" + window.location.port : "");
            var candidates = [window.location.protocol + "//" + basePort];
            if (MARKETING_PARENT_DOMAINS.indexOf(base) !== -1) {
              candidates.push(window.location.protocol + "//www." + basePort);
            }
            return candidates;
          }
          return [window.location.origin];
        })();

        window.atmConsumer = {};
        if (ATM_DEBUG) {
          window.atmConsumer.received = [];
        }
        // Dev-visible, tamper-resistant mirrors of the consumer's
        // security-relevant state: getter-only and non-configurable, so
        // frame scripts can read but cannot write or redefine them — and
        // even replacing window.atmConsumer wholesale cannot touch the
        // closure variables the enforcement paths read.
        Object.defineProperty(window.atmConsumer, "initialized", {
          enumerable: true,
          get: function () {
            return initialized;
          },
        });
        Object.defineProperty(window.atmConsumer, "metricsPosted", {
          enumerable: true,
          get: function () {
            return metricsPosted;
          },
        });
        Object.defineProperty(window.atmConsumer, "pixelFireMetricsPosted", {
          enumerable: true,
          get: function () {
            return pixelFireMetricsPosted;
          },
        });
        Object.defineProperty(window.atmConsumer, "killedPixelIds", {
          enumerable: true,
          get: function () {
            // A fresh copy per read: the closure array stays the
            // authoritative state, out of frame scripts' reach.
            return killedPixelIds.slice();
          },
        });

        // Per-session envelope auth token, learned ONLY from a validated
        // init (authenticated by origin gate + sender check). Envelopes
        // must carry it; before init none exists, so pre-init envelopes
        // are dropped — the parent sends init before it flushes any
        // envelope, and postMessage order is preserved, so nothing
        // legitimate is lost. (Keep doc
        // security/aki-security-index/products/claude-ai-web.md §6 /
        // CLAU-AI-WEB-06: privileged channels authenticate messages
        // with per-session tokens; the envelope carries routing
        // authority, so the origin gate alone is not the whole gate.)
        var sessionToken = null;

        // First-init latch, closure-local for the same reason as
        // sessionToken and metricsPosted: it enforces the token-binding
        // property (CLAU-AI-WEB-06 — the token stays bound to the
        // handshake that earned it), and in-frame vendor scripts are
        // exactly the code that must not be able to reset it. The
        // dev-visible window.atmConsumer.initialized is a getter-only
        // mirror of this variable.
        var initialized = false;

        // Per-pixel killswitch snapshot, learned ONLY from the validated
        // init; the parent-side fan-out check in atmBridge is the live,
        // authoritative enforcement, and the adapter router in
        // executeInstruction consults this at fire time as redundancy
        // for envelopes that crossed before the list did. Closure-local
        // like sessionToken, with a getter-only mirror below: in-frame
        // vendor scripts may read which ids are killed, never un-kill
        // them.
        var killedPixelIds = [];
        // Google restricted data processing off switch, set only from the validated init.
        var googleRdpOff = false;
        var googleRdpSet = false;

        // Report one reject to the parent for Datadog emission (see
        // METRIC_MESSAGE_TYPE above). Counts only — the rejected
        // message's content never rides along. Uses the same outbound
        // origin pin as the ready loop: before init that is the derived
        // parent origin; a page load whose parent has no ATM handler
        // mounted simply drops these, which is the fail-safe direction.
        function postMetric(reason) {
          if (metricsPosted >= METRICS_MAX) {
            return;
          }
          metricsPosted += 1;
          for (var i = 0; i < parentOrigins.length; i++) {
            // Per-candidate try: one failing post must not starve the
            // other candidate of the same message.
            try {
              realParent.postMessage(
                { source: MESSAGE_TARGET, type: METRIC_MESSAGE_TYPE, metric: reason },
                parentOrigins[i],
              );
            } catch (e) {
              logDebug("Failed to post metric to parent", { error: String(e) });
            }
          }
        }

        // State-like adapter conditions repeat per routed event (a
        // dormant vendor sees every event routed to it), so each such
        // reason posts once per page load; unlatched, a busy session
        // would exhaust METRICS_MAX with an expected state and blind
        // the relay's reject counts. adapter_failed stays
        // per-occurrence (see executeInstruction): a throw is
        // exceptional and its volume is the signal. Null-prototype for
        // the same reason as initializedMetaPixelIds below.
        var adapterConditionPosted = Object.create(null);
        function postAdapterCondition(reason) {
          if (adapterConditionPosted[reason]) return;
          adapterConditionPosted[reason] = true;
          postMetric(reason);
        }

        // Report one pixel fire to the parent for Datadog emission
        // (see PIXEL_FIRE_MESSAGE_TYPE above). Per-occurrence on
        // purpose, unlike the latched state-like conditions: the count
        // IS the signal - fire volume per (event, destination,
        // pixel id), read against the parent's delivery counts and the
        // observer's pixel_observed. Same outbound origin pin
        // and fail-safe drop direction as postMetric.
        function postPixelFireMetric(eventName, destination, pixelId) {
          if (pixelFireMetricsPosted >= PIXEL_FIRE_METRICS_MAX) {
            return;
          }
          pixelFireMetricsPosted += 1;
          for (var i = 0; i < parentOrigins.length; i++) {
            try {
              realParent.postMessage(
                {
                  source: MESSAGE_TARGET,
                  type: PIXEL_FIRE_MESSAGE_TYPE,
                  event: eventName,
                  destination: destination,
                  pixel_id: pixelId,
                },
                parentOrigins[i],
              );
            } catch (e) {
              logDebug("Failed to post pixel-fire metric to parent", {
                error: String(e),
              });
            }
          }
        }

        // A non-string or opaque "null" origin is rejected before
        // new URL() can throw. A CROSS-origin embedder must also be
        // https on this frame's own port — hostname alone is not a trust
        // boundary (an http origin is MITM-forgeable; a different port is
        // a different server). With scheme and port pinned, the
        // base-domain branch accepts the parent this deployment embeds
        // us under — on the marketing zones in its bare or www form
        // (mirroring the outbound candidate pair), on every other host
        // by the pre-existing base-domain rule, unchanged. The
        // same-origin first branch is an exact match and does not
        // require https, so local dev is unaffected.
        function isAllowedOrigin(origin) {
          if (typeof origin !== "string" || origin === "null" || origin === "") {
            return false;
          }
          if (origin === window.location.origin) {
            return true;
          }
          var originUrl;
          try {
            originUrl = new URL(origin);
          } catch (e) {
            return false;
          }
          if (
            originUrl.protocol !== "https:" ||
            originUrl.port !== window.location.port
          ) {
            return false;
          }
          var originHostname = originUrl.hostname;
          var currentHostname = window.location.hostname;
          var baseDomain = currentHostname.indexOf("a.") === 0
            ? currentHostname.substring(2)
            : currentHostname;
          if (MARKETING_PARENT_DOMAINS.indexOf(baseDomain) !== -1) {
            // Marketing zones: exact two-candidate match — the parent
            // domain's bare form and its www form, mirroring the
            // outbound candidate pair above. Exact equality, no suffix
            // matching, and no stripping of the ORIGIN's own labels, so
            // evil-claude.com, claude.com.evil forms, and nested
            // a./www. combinations (a.www.claude.com) all stay
            // rejected.
            return (
              originHostname === baseDomain ||
              originHostname === "www." + baseDomain
            );
          }
          // claude.ai family: the pre-existing base-domain rule,
          // unchanged — www.claude.ai stays rejected exactly as before.
          var originBaseDomain = originHostname.indexOf("a.") === 0
            ? originHostname.substring(2)
            : originHostname;
          return originBaseDomain === baseDomain;
        }

        // --- vendor adapters -------------------------------------------
        // Adapters EXECUTE the envelope's resolved instruction: for each
        // destinations[] entry the router below calls that vendor's
        // adapter with the validated envelope and that entry. The parent
        // dictates WHERE an event goes AND which pixel/tag ids it fires
        // for - the entry's `pixel_ids`, resolved parent-side from the
        // single config source (ATM_VENDOR_PIXEL_IDS in atmConfig.ts),
        // so this side carries no per-product ids of its own. An entry
        // that arrives without ids keeps that adapter DORMANT: it logs
        // and fires nothing, and loads no vendor code. The adapter owns
        // HOW its vendor is called - vendor API shape and the
        // event-name mapping below.

        // The vendor event names this adapter knows how to fire, in
        // Meta's own vocabulary. The envelope entry carries WHICH name
        // to fire (vendor_event, config-declared parent-side); this
        // set is the iframe's guard that only known Meta events ever
        // reach fbq - an absent or unlisted value is dropped, never
        // forwarded as a guessed custom event. Vendor vocabulary is
        // stable, so this set only grows when a Meta event TYPE is
        // first used; onboarding an envelope event is config-only.
        var META_ALLOWED_VENDOR_EVENTS = {
          PageView: true,
          Purchase: true,
          CompleteRegistration: true,
        };
        // Meta dataset ids are numeric; same pre-fire guard class as
        // every other adapter, so a forged envelope's arbitrary string
        // never reaches fbq and is counted like any other bad id. The
        // 13-17 digit bound is a heuristic from observed ids - Meta's
        // docs show only placeholders, no id format - so widen it if a
        // real dataset id ever falls outside it.
        var META_PIXEL_ID_PATTERN = /^[0-9]{13,17}$/;
        // Meta pixel ids already init'ed on the shared fbq queue, so a
        // fan-out to several datasets inits each exactly once.
        // Null-prototype: ids are envelope strings, and a name like
        // "constructor" must behave like any other id.
        var initializedMetaPixelIds = Object.create(null);

        // Install the standard fbq command-queue stub and start loading
        // fbevents.js (CSP: script-src already carries
        // connect.facebook.net; the /tr fires it makes are covered by
        // img-src * and connect-src *.facebook.com). Readable version
        // of Meta's minified base snippet; the stub queues calls until
        // fbevents.js swaps in callMethod, so call order is preserved.
        function ensureMetaPixelBase() {
          if (window.fbq) {
            return;
          }
          var fbq = function () {
            if (fbq.callMethod) {
              fbq.callMethod.apply(fbq, arguments);
            } else {
              fbq.queue.push(arguments);
            }
          };
          fbq.push = fbq;
          fbq.loaded = true;
          fbq.version = "2.0";
          fbq.queue = [];
          window.fbq = fbq;
          if (!window._fbq) {
            window._fbq = fbq;
          }
          var scriptTag = document.createElement("script");
          scriptTag.async = true;
          scriptTag.src = "https://connect.facebook.net/en_US/fbevents.js";
          var firstScript = document.getElementsByTagName("script")[0];
          if (firstScript && firstScript.parentNode) {
            firstScript.parentNode.insertBefore(scriptTag, firstScript);
          } else {
            (document.head || document.documentElement).appendChild(scriptTag);
          }
        }

        // Meta Pixel adapter. Fires for the ids the instruction's
        // entry carries (config-declared parent-side, riding the
        // envelope as `pixel_ids`): each id is init'ed lazily on its
        // first firing instruction - a frame whose instructions never
        // carry Meta ids never loads Meta code - then fired with ONE
        // trackSingle per id, so a multi-dataset fan-out fires each
        // dataset exactly once. The fbq eventID is the entry's own
        // dedupe_id when the parent composed one for this destination,
        // else the envelope's dedupe_id when the parent's config
        // extracted one, else the client-minted event_id - the dedupe
        // key Meta uses against a
        // server-side CAPI twin of the same firing, within each
        // dataset (Meta documents eventID as track's trailing options
        // argument; passing the same trailing object to trackSingle is
        // inferred from that, not shown verbatim in Meta's reference,
